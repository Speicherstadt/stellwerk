# Builds docs/ with Zensical and the demo (web/src/demo, `bun run build:demo`) and publishes both
# to GitHub Pages: https://speicherstadt.org/stellwerk/ and https://speicherstadt.org/stellwerk/demo/
# Pull requests build both (`zensical build --strict` and `bun run build:demo`), so broken links or
# a broken demo fail before the merge.
# One-time requirement: Settings → Pages → Source "GitHub Actions"
# (configure-pages with enablement switches that on itself during the first run).
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs-revision-date/**"
      - ".github/workflows/docs.yml"
      # The demo under /demo/ is the web app's own build
      - "web/**"
      - "package.json"
      - "bun.lock"
  pull_request:
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs-revision-date/**"
      - ".github/workflows/docs.yml"
      # The demo under /demo/ is the web app's own build
      - "web/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys run one after the other; a new push to a pull request cancels its outdated build
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the date under every page comes from the last commit of its file
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: python -m unittest discover -s scripts/docs-revision-date
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - run: zensical build --strict
      # Without the git history the date is missing without failing the build; here it shows
      - run: grep -q 'class="revision-date"' site/index.html
      - run: grep -q 'application/ld+json' site/index.html
      # The demo without a server: the web app over its fixtures (web/src/demo), at /demo/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:demo && cp -r web/dist-demo site/demo
      # GitHub Pages serves the site under /stellwerk/, so the demo's files are at /stellwerk/demo/
      - run: grep -q '"/stellwerk/demo/assets/' site/demo/index.html
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
